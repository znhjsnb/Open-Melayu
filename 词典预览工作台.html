, murah sikit.", "ms_standard": "Ambillah yang ini kerana harganya lebih murah sedikit.", "zh": "拿这个啦，便宜一点。", "en": "Get this one, it's a bit cheaper.", "spoken_features": ["ni 是 ini 的口语缩短。", "lah 在这里使建议更自然；正式正字法中的 -lah 与前词连写。", "sikit 对应 sedikit；口语省略了可由语境理解的 harganya。"]}], "spoken_shortcuts": [{"abbr": "yg", "full_form": "yang", "note": "常见聊天省写；正式写作恢复 yang。"}, {"abbr": "yng", "full_form": "yang", "note": "原始聊天规则中记录的另一非标准拼写，不作规范形式推荐。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "关系标记本身不区分礼貌等级。Yang 也用于 Yang Berhormat、Yang Berbahagia 等礼仪称谓，不能据字面随意套给任何人。", "usage_etiquette": "正式文书中的礼仪称谓应按收件人的实际称号核实。yang 作为 sayang 的缩短呼语带亲密意味，不宜用于陌生人、普通同事或服务对象。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Malay / Old Malay; homonyms have separate histories", "root_origin": "功能词 yang 已见古马来语材料。Kaikki 将其与 ia + -ng 联系起来，但明确带有推测性，不能当作已证实的现代构词规则。神灵义另与 hiang 及其南岛语对应形式相关；亲密呼语义是 sayang 的缩短。这三者不可拼接为一条词源。", "cognitive_memory_aid": "把 yang 想成连接“对象”和“说明”的桥：orang + yang + membantu saya → 帮助我的人。这是语法记忆式，不是历史词源公式。"}}, {"headword": {"word": "aku", "syllables": "a.ku", "ipa": "/ˈaku/", "jawi": "اکو", "frequency_rank": 3, "status": "official"}, "morphology": {"is_root": true, "root_word": "aku", "affix": null, "affix_type": "none", "formula": "∅ + aku → aku", "pattern_note": "独立代词。缩短形式 ku-、-ku 是代词附着形式，不应一概当作派生词缀；mengaku 等则属于已有词汇化的派生词族。", "word_family": [{"word": "beraku", "affix": "ber-", "gloss": "用 aku 自称 / use aku as one's self-reference"}, {"word": "mengaku", "affix": "meN- (meng-)", "gloss": "承认；声称 / admit; claim"}, {"word": "mengakui", "affix": "meN-...-i", "gloss": "承认某事；认可 / acknowledge; recognise"}, {"word": "pengakuan", "affix": "peN-...-an", "gloss": "承认；供认 / acknowledgement; confession"}, {"word": "perakuan", "affix": "per-...-an", "gloss": "认证；证明 / certification; attestation"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "我；亲密、随意或带强烈个人声音的第一人称单数代词，常见于熟人对话、内心独白、文学及个人祈祷。", "en_definition": "I; me; my after a noun. A first-person singular pronoun used in familiar interaction, personal reflection, literature, and prayer.", "ms_definition": "kata ganti nama diri pertama (selalu digunakan dlm perhubungan yg akrab antara sesama kawan dan antara manusia dgn Allah tetapi agak kasar jika digunakan ketika berbicara dgn orang yg harus dihormati)", "nuances": "此处采用实际提供的 DBP《Kamus Pelajar》第二版，不伪标为《Kamus Dewan》。aku 不天然等于粗口，语气可亲近、坚定或敌对；具体效果由关系和场景决定。buku aku 是“我的书”；标准附着形式如 bukuku 连写。"}], "dual_scenarios": [{"scenario": "formal", "context": "规范文学叙事 / 第一人称内心独白", "ms": "Aku bertekad untuk meneruskan pelajaran walaupun terpaksa menghadapi pelbagai kesukaran.", "zh": "即使必须面对种种困难，我也决心继续求学。", "en": "I was determined to continue my studies despite the many difficulties I would have to face."}, {"scenario": "colloquial", "context": "WhatsApp / 熟朋友相约吃饭", "ms_spoken": "Aku dah lapar lah. Jom makan kat kedai depan tu.", "ms_standard": "Aku sudah lapar. Mari kita makan di kedai di hadapan itu.", "zh": "我饿了啦。走，去前面那家店吃。", "en": "I'm hungry already. Let's eat at that place up ahead.", "spoken_features": ["dah = sudah；kat 在此相当于 di；tu = itu。", "jom 是口语邀约语，对应 mari kita。", "lah 增添随意语气；aku 标示双方已有熟悉关系。"]}], "spoken_shortcuts": [{"abbr": "ak", "full_form": "aku", "note": "熟人聊天中的省写；不是正式书写。"}, {"abbr": "aq", "full_form": "aku", "note": "网络变体，用 q 代 ku；语域很随意。"}, {"abbr": "ku", "full_form": "aku", "note": "代词附着形式，非纯短信缩写；标准写法视位置为 ku- 或 -ku，如 kulihat、bukuku，须与所附词连写。"}], "cultural_pragmatics": {"register": "intimate", "politeness_note": "与已习惯 aku/kau 的亲友可自然使用；向初识者、老师、客户、长辈或上司自称 aku，容易显得无礼或挑衅。某些家庭和地区容许范围较宽，不能只凭年龄或族群推定已获这种亲密许可。", "usage_etiquette": "不确定时用 saya，并观察对方和群体既有称呼习惯。文学独白或向 Allah 祈祷中的 aku 有其传统语境，不意味着可以在职场照搬。正式例句展示规范文学语体，不是向上司发言的模板。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Austronesian, through Proto-Malayic", "root_origin": "继承自原始马来语 *aku，并可上溯至原始南岛语 *aku。星号标示比较语言学重建形式，不是现存书面语拼写。", "cognitive_memory_aid": "把 Aku 与亲近的“我”绑定，把 saya 与礼貌的“我”绑定；先判断关系，再选代词。"}}, {"headword": {"word": "dia", "syllables": "dia", "ipa": "/ˈdijə/", "jawi": "دي", "frequency_rank": 4, "status": "official"}, "morphology": {"is_root": true, "root_word": "dia", "affix": null, "affix_type": "none", "formula": "∅ + dia → dia", "pattern_note": "现代语法中为独立代词，不能按被动前缀 di- + ia 进行能产拆分。音节字段保留 DBP Daftar Rumi-Jawi 的原样标注 [dia]，不把 IPA 中的过渡音 /j/ 当作新增字母。", "word_family": [{"word": "mendiakan", "affix": "meN-...-kan", "gloss": "以 dia 称呼某人，带贬低意味 / refer to someone as dia with a belittling intent"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "他；她；不区分性别的第三人称单数人称代词，也可作宾语或后置领属语。", "en_definition": "He or she; him or her; his or her after a noun. A gender-neutral third-person singular personal pronoun.", "ms_definition": "kata ganti diri ketiga (utk menegaskan atau merendahkan), ia", "nuances": "DBP《Kamus Dewan》第四版释义，已通过 PRPM 交叉检索补核。现代中性对话中非常常见，不应把括注理解为每次使用都有贬义。Saya kenal dia（我认识他／她）、rumah dia（他／她的家）。口语可将物品拟人化称为 dia，但学习者不可机械地把英语所有 it 都译成 dia；正式说明可重提名词或按语境选 ia。音标采用半岛南部 /ˈdijə/；所给资料另有 /ˈdija/。"}, {"id": 2, "pos": "particle", "zh_definition": "用于固定说法 itu dia，指认或表示发现：就是那个人／那个东西；原来如此；找到了。", "en_definition": "In itu dia: there he or she is; there it is; that is the person, thing, or situation meant.", "ms_definition": "itu dia: itu orangnya; itulah bendanya (perkaranya), itulah keadaan yg sebenarnya", "nuances": "DBP《Kamus Dewan》第四版的固定表达义，按 Schema 归 particle；并非声称 dia 在其他位置均为语气词。例如找回钥匙时可说 Itu dia!，应按具体场景译为“找到了！”。"}], "dual_scenarios": [{"scenario": "formal", "context": "新闻 / 对一般参赛者的报道", "ms": "Selepas menamatkan perlumbaan, dia mengucapkan terima kasih kepada para sukarelawan.", "zh": "完成比赛后，他／她向志愿者们表示感谢。", "en": "After finishing the race, the participant thanked the volunteers."}, {"scenario": "colloquial", "context": "WhatsApp / 告知朋友某人已到达", "ms_spoken": "Dia dah sampai, tengah tunggu kat luar tu.", "ms_standard": "Dia sudah sampai dan sedang menunggu di luar.", "zh": "他／她到了，正在外面等呢。", "en": "They're here already, waiting outside.", "spoken_features": ["dah = sudah；tengah 在这里表示动作正在进行，对应 sedang。", "kat = di；tu 在此带现场指示语气。", "口语省略第二分句的主语；英语 singular they 保留原句未说明的性别。"]}], "spoken_shortcuts": [{"abbr": "dy", "full_form": "dia", "note": "非正式聊天省写，不代表英语 him 或 his。"}, {"abbr": "dya", "full_form": "dia", "note": "非标准聊天变体。"}, {"abbr": "diorang", "full_form": "mereka", "note": "源于 dia orang 的口语复数形式；指“他们／她们”，不能当成单数 dia 的等义拼写。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "dia 通常中性；正式提及受尊敬的人士时可用 beliau，王室语境按礼仪使用 baginda。在当事人面前指着对方反复说 dia，尤其语气生硬时，容易显得失礼。", "usage_etiquette": "首次提及时先给姓名或身份，使后续 dia 指向明确。马来语原句没有性别信息，翻译成中文或英文时不要凭空决定男女；dia 也不随主宾格变化。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Malay, related to inherited ia", "root_origin": "所给 Kaikki 提出历史上的 di + ia 融合分析；此处仅作为来源分析转述，不将 di- 认作现代被动词缀。ia 一系的代词形式可追溯至南岛语。原材料中关于英语 they 的旁注缺乏可用论证，未采纳。", "cognitive_memory_aid": "记 Saya kenal dia（我认识他／她）：dia 不分“他”和“她”，也不变成另一种宾格形式。"}}, {"headword": {"word": "awak", "syllables": "a.wak", "ipa": "[ˈʔa.waʔ]", "jawi": "اوق", "frequency_rank": 5, "status": "official"}, "morphology": {"is_root": true, "root_word": "awak", "affix": null, "affix_type": "none", "formula": "∅ + awak → awak", "pattern_note": "独立词根；末尾 k 在常见马来西亚读法中实现为喉塞音 [ʔ]，Rumi 拼写仍为 k。a.wak 是据读音和拼写提供的分节；缓存只有 DBP 发音标注 [a.waʔ]，并无可直接照抄的 syllables 值。", "word_family": [{"word": "berawak", "affix": "ber-", "gloss": "用 awak 称呼对方；配备船员 / address someone as awak; have a crew"}, {"word": "perawakan", "affix": "per-...-an", "gloss": "体格；体态 / physique; bodily build"}, {"word": "berperawakan", "affix": "ber- + per-...-an", "gloss": "具有某种体态 / have a particular physique or appearance"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "你；常用于同辈或已有适当熟悉程度的人之间的第二人称单数代词。", "en_definition": "You; your after a noun. A second-person singular pronoun commonly used between peers or people on familiar terms.", "ms_definition": "kata ganti diri kedua, engkau, kamu", "nuances": "DBP《Kamus Dewan》第四版义项。比 kau 通常柔和，但不是无条件适用的敬称；可用于恋人或配偶之间，也不因此自动含浪漫意思。buku awak 是“你的书”。"}, {"id": 2, "pos": "noun", "zh_definition": "身体、身躯；这一较旧用法仍保留在搭配和词族中。awak kapal 也可指船体。", "en_definition": "Body or bodily frame; an older sense also found in compounds. Awak kapal may refer to a ship's hull.", "ms_definition": "badan, tubuh; awak kapal: badan kapal", "nuances": "DBP《Kamus Dewan》第四版义项。现代日常说身体通常用 badan 或 tubuh；不要把所有 awak 都译成“你”。perawakan（体态）与这个身体义相关。"}, {"id": 3, "pos": "noun", "zh_definition": "船员、船上工作人员；常见于 awak kapal、awak perahu。", "en_definition": "Crew or a crew member, especially in awak kapal or awak perahu.", "ms_definition": "awak kapal: anak buah kapal (perahu dll); awak perahu: anak buah perahu", "nuances": "DBP《Kamus Dewan》第四版搭配义。新闻中的 tiga orang awak kapal 指三名船员，不是“三个你的船”；单复数由数词及语境决定。"}, {"id": 4, "pos": "pronoun", "zh_definition": "自己、自身；在 awak sama awak 等表达中指自己人之间。", "en_definition": "Self; oneself, or one's own group in expressions such as awak sama awak.", "ms_definition": "diri (sendiri); awak sama awak: sesama sendiri, antara kita sendiri (tidak melibatkan orang luar)", "nuances": "DBP《Kamus Dewan》第四版第 3 义。orang awak 的“自己人”义在原材料标为 Mn（米南加保语用法），不是全国通用的第一人称替代词；普通“我自己”用 diri saya。"}], "dual_scenarios": [{"scenario": "formal", "context": "新闻 / 海上救援报道（船员义）", "ms": "Semua awak kapal berjaya diselamatkan oleh pasukan penyelamat maritim.", "zh": "所有船员均已由海上救援队成功救出。", "en": "All crew members were successfully rescued by the maritime rescue team."}, {"scenario": "colloquial", "context": "WhatsApp / 熟悉的同事之间", "ms_spoken": "Awak dah makan? Kalau belum, jom makan kat bawah.", "ms_standard": "Awak sudah makan? Jika belum, mari kita makan di tingkat bawah.", "zh": "你吃了吗？还没的话，一起去楼下吃。", "en": "Have you eaten? If not, let's grab something downstairs.", "spoken_features": ["dah = sudah；jom 对应 mari kita；kat 在此对应 di。", "此场景中的 bawah 指楼下，标准等义句补明 tingkat。", "称呼 awak 体现同事之间已有适当熟悉程度。"]}], "spoken_shortcuts": [{"abbr": "awk", "full_form": "awak", "note": "非正式聊天中常见的省元音写法；正式书写恢复 awak。"}], "cultural_pragmatics": {"register": "colloquial", "politeness_note": "对同辈和熟人通常自然，对长辈、老师、上司或初次接触的客户则可能显得过于随便；比 kau 柔和并不等于敬称。恋人间 saya/awak 很常见，但同事使用这组代词也不自动表示亲密关系。", "usage_etiquette": "需要礼貌时用对方姓名、职衔或合适的 encik、puan、cik；勿按族群决定对方是否接受 awak。正式例句采用完全不同的船员义，不能据此推断第二人称 awak 适合所有正式场合。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Malayic, ultimately Proto-Austronesian", "root_origin": "所给 Kaikki 追溯至原始马来语 *awak、原始马来-波利尼西亚语 *hawak 和原始南岛语 *Sawak（腰）。现代词典同时记录身体、自身及第二人称用法；不将语义联系虚构为现代词缀拆分。", "cognitive_memory_aid": "成组记 Saya …, awak …（我……，你……）；再用 awak kapal（船员）提醒自己，同一拼写还可能是名词。"}}, {"headword": {"word": "kau", "syllables": "kau", "ipa": "[kau̯]", "jawi": "کاو", "frequency_rank": 6, "status": "colloquial"}, "morphology": {"is_root": false, "root_word": "engkau", "affix": null, "affix_type": "none", "formula": "∅ + engkau → kau (pemendekan)", "pattern_note": "engkau → kau 是缩短，不是加缀，也不是 kamu 的严格缩写。独立口语 kau 与被动结构中的代词前附着式 kau- 要区分；kau- 与后面的动词连写，如 kaubaca，不是被动前缀 di-。", "word_family": [{"word": "engkau", "affix": "none", "gloss": "你；kau 的完整形式 / you; full form underlying kau"}, {"word": "dikau", "affix": "none", "gloss": "诗歌或古雅语体的“你”；非能产 di- 被动派生 / poetic or literary you; not productive passive di- derivation"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "你；engkau 的缩短形式，常见于亲近者之间的随意对话，也可表达生硬或敌对态度。", "en_definition": "You; your after a noun in familiar speech. A shortened form of engkau, ranging from intimate to confrontational depending on context.", "ms_definition": "singkatan bagi engkau", "nuances": "DBP《Kamus Dewan》第四版释义。kau orang 的口语复数义是“你们”；独立 kau 在口语中自由使用，但正式写作宜按标准结构处理或使用完整 engkau。status 标 colloquial 指本词头主要口语用途，不表示 DBP 未收录。"}, {"id": 2, "pos": "pronoun", "zh_definition": "第二人称代词的前附着形式，用在以受事为话题的被动结构中，表示动作由“你”执行。", "en_definition": "The bound second-person pronominal form attached before a passive verb, identifying you as the agent.", "ms_definition": "kep engkau (digunakan sbg awalan yg terikat dgn kata kerja pasif)", "nuances": "此义来自 DBP《Kamus Pelajar》第二版，且 DBP 用法答复确认其连写规则。Buku itu kaubaca（那本书由你读）中的 kau- 与 baca 连写；不可机械写成 kau dibaca 来表达同一结构。它是代词附着成分，不是一般派生前缀。"}], "dual_scenarios": [{"scenario": "formal", "context": "规范书面指示 / 对熟悉对象使用 kau- 被动结构", "ms": "Dokumen itu hendaklah kauserahkan kepada setiausaha sebelum mesyuarat bermula.", "zh": "那份文件须由你在会议开始前交给秘书。", "en": "You must submit that document to the secretary before the meeting begins."}, {"scenario": "colloquial", "context": "WhatsApp / 已习惯 aku/kau 的好朋友", "ms_spoken": "Kau dah sampai ke? Aku tunggu kat luar ni.", "ms_standard": "Adakah engkau sudah sampai? Aku sedang menunggu di luar.", "zh": "你到了没？我在外面等着呢。", "en": "Are you here yet? I'm waiting outside.", "spoken_features": ["kau 是 engkau 的缩短；dah = sudah；kat = di。", "句末 ke 是口语疑问标记，此处不是表示方向的介词 ke；标准句改用 adakah。", "ni 在此增加近处、当前情境的指示语气。"]}], "spoken_shortcuts": [{"abbr": "kau", "full_form": "engkau", "note": "口语独立形式，也有标准书面的前附着用法 kau-；不要错标为 kamu 的缩写。"}, {"abbr": "korang", "full_form": "kamu semua", "note": "由 kau orang 缩成的口语复数，意为“你们”；不能替换单数 kau 而不改变人数。"}], "cultural_pragmatics": {"register": "intimate", "politeness_note": "仅在双方已接受 aku/kau 的亲密或同辈交往中稳妥。向陌生人、长辈、老师、上司或客户直接称 kau，常被听成无礼；提高音量或用手指人时尤其可能带挑衅。对方对你用 kau，也不一定表示你可以对称地回用。", "usage_etiquette": "先沿用对方姓名或合适称谓，不以同龄、男性朋友或任何族群身份自动推定许可。正式例句展示的是标准连写的 kau-，不是向上司发指令的称呼建议；诗歌、歌词及祈祷另有语域约定。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Malay engkau; inherited Austronesian pronoun family", "root_origin": "现代 kau 是 engkau 的缩短。所给 Kaikki 同时列原始马来语 *kau 及更早的南岛语第二人称重建形式；历史上的 *kau 与现代 engkau → kau 缩短描述属于不同分析层面。", "cognitive_memory_aid": "记 engkau 缩成 kau，再成对记 aku/kau；短得亲近，也可能短得生硬，先看关系。"}}, {"headword": {"word": "ini", "syllables": "i.ni", "ipa": "/ˈini/", "jawi": "اين", "frequency_rank": 7, "status": "official"}, "morphology": {"is_root": true, "root_word": "ini", "affix": null, "affix_type": "none", "formula": "∅ + ini → ini", "pattern_note": "独立指示词，不生造 i- 前缀。ini + -lah → inilah 中 -lah 为强调附着词，非派生后缀；口语 ini → ni 为起首元音省略。", "word_family": [{"word": "inilah", "affix": "-lah (particle)", "gloss": "就是这个；正是这里所指 / this is precisely; this very one"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "这、这个、这些；指靠近说话者、当前正在指示或讨论的人、物或事项，也可后置限定名词。", "en_definition": "This or these; a proximal demonstrative used independently or after a noun to identify something near the speaker or current in the discourse.", "ms_definition": "kata yg digunakan utk menunjuk waktu, tempat atau benda yg dekat", "nuances": "采用所给 DBP《Kamus Pelajar》第二版定义。Ini buku saya（这是我的书）与 buku ini（这本书）展示独立指示和名词后置限定；Schema 无 determiner，均归 pronoun。ini 不标单复数，不能机械译为单数 this；本次讨论的 isu ini 不必是空间上靠近的物体。"}, {"id": 2, "pos": "pronoun", "zh_definition": "用于时间表达，表示当前所属或即将到来的这一时段，如今天、今晚、这一周。", "en_definition": "This in time expressions, referring to the present or contextually upcoming period.", "ms_definition": "sekarang ini: pd masa sekarang; petang ini: petang nanti", "nuances": "DBP《Kamus Pelajar》第二版所列搭配义。hari ini（今天）、malam ini（今晚）、minggu ini（这一周）；petang ini 指今天下午，是否尚未到来需看说话时间。"}, {"id": 3, "pos": "particle", "zh_definition": "用于固定表达 ini pula，引出更突出的情况：更何况这个、尤其是这个。", "en_definition": "In the idiomatic expression ini pula: all the more so in this case; especially this.", "ms_definition": "ini pula: istimewa pula; lebih-lebih lagi", "nuances": "来自所给 DBP《Kamus Pelajar》第二版。仅说明该固定表达的词典义；普通上下文中的 ini pula 也可能只是“而这个呢”，必须结合句意判断。"}], "dual_scenarios": [{"scenario": "formal", "context": "公文 / 申请说明", "ms": "Borang ini hendaklah dikemukakan sebelum tarikh tutup permohonan.", "zh": "此表格须在申请截止日期之前提交。", "en": "This form must be submitted before the application deadline."}, {"scenario": "colloquial", "context": "日常购物 / 与熟人讨论商品", "ms_spoken": "Yang ni cantik lah. Kau nak yang mana?", "ms_standard": "Yang ini cantik. Engkau hendak yang mana?", "zh": "这个好看耶。你想要哪个？", "en": "This one's nice. Which one do you want?", "spoken_features": ["ni = ini，口语缩短在本句中替代完整词形。", "nak = hendak；kau = engkau，此处假设对话者是熟朋友。", "lah 在这里表达说话者的赞赏或认同，并非词义的一部分。"]}], "spoken_shortcuts": [{"abbr": "ni", "full_form": "ini", "note": "日常口语及聊天常见；正式书写用 ini。"}, {"abbr": "nie", "full_form": "ini", "note": "非标准聊天拼写，可反映拉长或随意语气。"}, {"abbr": "nii", "full_form": "ini", "note": "重复元音的聊天形式，用于语气延长，不是新的标准词形。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "ini 本身不分尊卑；礼貌取决于指示方式和所指对象。介绍客人时说 Ini Encik Lim 很自然，但只指着人说 yang ini，可能显得把人当物品挑选。", "usage_etiquette": "先记名词后置结构 buku ini；正式文件、学校作文和公告用完整 ini。ni 很日常，却不适合作为正式正字法；使用 ini 时也要注意是否已说明所指对象。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Austronesian, through Proto-Malayic", "root_origin": "所给 Kaikki 追溯至原始马来语 *(i)ni(ʔ) 及更早的 *ini 指示词。保留其继承关系，不以现代 i + ni 编造构词法。", "cognitive_memory_aid": "指着近处的书说 buku ini，再指远处说 buku itu：ini 近、itu 远；真实用法也能指当前话题。"}}, {"headword": {"word": "di", "syllables": "di", "ipa": "/di/", "jawi": "د", "frequency_rank": 8, "status": "official"}, "morphology": {"is_root": true, "root_word": "di", "affix": null, "affix_type": "none", "formula": "∅ + di → di", "pattern_note": "本词头的地点介词 di 是独立功能词，Rumi 中与后词分写：di rumah。被动前缀另写作 di-，公式 di- + baca → dibaca；二者不能混为同一个加缀词族。单音节 di 为发音分节。Jawi 的 د 在搭配中另遵 Jawi 拼写规则，不能照搬 Rumi 空格。", "word_family": []}, "senses": [{"id": 1, "pos": "preposition", "zh_definition": "在、位于；引出地点或空间位置，可依后接名词译为在……里、上、旁等。", "en_definition": "At, in, or on; introduces a location or spatial position.", "ms_definition": "kata sendi nama yg menunjukkan tempat dll", "nuances": "DBP《Kamus Dewan》第四版 di I 第 1 义，经 PRPM 交叉检索补核。di rumah（在家）、di atas meja（在桌上）。表示移动目的地通常用 ke：pergi ke sekolah；表示时间通常用 pada：pada hari Isnin。不要把所给英文 gloss 中的 direction 无限制套为“往”。"}, {"id": 2, "pos": "preposition", "zh_definition": "在一些既有或旧式表达中相当于 pada、dalam，表示某种视角、处境或时间背景。", "en_definition": "In certain established or older expressions, corresponds to pada or dalam, including figurative perspective or temporal setting.", "ms_definition": "pada, dalam", "nuances": "DBP《Kamus Dewan》第四版 di I 第 2 义。词典保存的 di hari kemudian 等用例不等于允许现代正式作文普遍用 di 表时间；实用写作按语法规范选 pada。区域标记 Mn 下的其他介词用法不在此作为通用规则教授。"}, {"id": 3, "pos": "noun", "zh_definition": "拉丁字母 D／d 的名称；与地点介词同形。", "en_definition": "The name of the Latin letter D or d; a homonym of the locative preposition.", "ms_definition": "Takrif editorial berdasarkan Kaikki: nama huruf D atau d dalam abjad Rumi.", "nuances": "此义仅由所给 Kaikki 支持，未标为 DBP 原文；headword.jawi 的 د 对应本词条核心介词，不能据此规定英语来源字母名称的独立 Jawi 拼法。字母名称的来源与地点介词不同。"}], "dual_scenarios": [{"scenario": "formal", "context": "公告 / 活动地点通知", "ms": "Taklimat tersebut akan diadakan di dewan utama pada pukul sembilan pagi.", "zh": "该说明会将于上午九时在主礼堂举行。", "en": "The briefing will be held in the main hall at nine in the morning."}, {"scenario": "colloquial", "context": "WhatsApp / 在商场约见", "ms_spoken": "Aku dah kat pintu utama. Kau tunggu di situ dulu lah.", "ms_standard": "Aku sudah berada di pintu utama. Engkau tunggulah di situ dahulu.", "zh": "我到正门了。你先在那边等一下啦。", "en": "I'm at the main entrance already. Wait there for now.", "spoken_features": ["kat 对应地点介词 di；同一段口语也可以自然保留完整 di situ。", "dah = sudah；dulu 在这里对应 dahulu，表示先做某事。", "lah 在这里缓和要求的语气；aku/kau 假设双方已熟悉。"]}], "spoken_shortcuts": [{"abbr": "d", "full_form": "di", "note": "聊天省写，如 d rumah；仅限能由上下文判断的地点用法。"}, {"abbr": "kat", "full_form": "di", "note": "地点语境下的口语替代，并非所有 kat 都能机械还原为 di。"}, {"abbr": "kt", "full_form": "di", "note": "聊天中常是 kat 的进一步省写；需结合地点语境判断。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "di 没有固有礼貌等级，公文和日常都使用。地点问句 di mana 本身中性，语气及称呼才决定是否客气。", "usage_etiquette": "Rumi 书写始终区分 di rumah、di sini 与 dibaca、ditulis。正式用 pada pukul sembilan，不照搬口语写 di pukul sembilan。Jawi 中 د 与后词的连写规则需独立处理，不能用 Rumi 的空格规则推断。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Austronesian locative forms; English for the letter-name homonym", "root_origin": "地点介词据所给 Kaikki 可追溯至南岛语方位标记 *di、*i，与现代英语 dee 无关。字母名称 di 则是另一个同形词，来源为英语 dee；两种来源分别归属不同义项。", "cognitive_memory_aid": "成对记 di rumah（在家，分写）与 dibaca（被读，连写）：一个定位，一个标记被动；这是 Rumi 拼写记忆法。"}}, {"headword": {"word": "tak", "syllables": "tak", "ipa": "[t̪aʔ]", "jawi": "تق", "frequency_rank": 9, "status": "colloquial"}, "morphology": {"is_root": false, "root_word": "tidak", "affix": null, "affix_type": "none", "formula": "∅ + tidak → tak (pemendekan)", "pattern_note": "核心否定义是 tidak 的缩短，无派生词缀；末尾 k 常读喉塞音 [ʔ]。tak 为单音节，缓存 [taʔ] 是发音标注。敲击声名词 tak 是另一个独立同形词，不由 tidak 缩成。", "word_family": [{"word": "tidak", "affix": "none", "gloss": "不；否定词的完整形式 / not; full negative form"}, {"word": "takkan", "affix": "none", "gloss": "不会；难道；tak akan 的缩合形式 / will not; surely not; contracted tak akan"}]}, "senses": [{"id": 1, "pos": "adverb", "zh_definition": "不、没；tidak 的缩短形式，用来否定动词、形容词或相应谓语。", "en_definition": "Not; the shortened form of tidak, used to negate verbs, adjectives, or corresponding predicates.", "ms_definition": "singkatan bagi tidak", "nuances": "DBP《Kamus Dewan》第四版定义。tak tahu（不知道）、tak mahal（不贵）、tak ada（没有）。通常名词身份否定用 bukan，如 Dia bukan guru，不用 tak 机械替换。这里按 Schema 和所给 Kaikki 归 adverb；马来语教学中通常称 kata nafi。"}, {"id": 2, "pos": "particle", "zh_definition": "在固定表达 tak apa 中表示没关系、不要紧；特定语境也可表示没什么。", "en_definition": "In tak apa: it is all right; never mind; or nothing is the matter, depending on context.", "ms_definition": "tak apa: tidak mengapa; tidak ada apa-apa", "nuances": "DBP《Kamus Dewan》第四版固定搭配。安慰、婉拒或接受道歉时的 tak apa 依语调有不同效果；它不是给 tak 单独增加一个通用的“好”义。"}, {"id": 3, "pos": "noun", "zh_definition": "嗒、笃等敲击声，尤指用石块敲木头一类声音；拟声同形词。", "en_definition": "A tapping or knocking sound, such as a stone striking wood; an onomatopoeic homonym.", "ms_definition": "bunyi spt bunyi orang mengetuk kayu dll dgn batu, bunyi detak", "nuances": "来自所给 DBP《Kamus Dewan》第四版另一条原始定义。与否定词 tak 的缩短关系无关；主词头的 colloquial 标记针对高频否定义。"}], "dual_scenarios": [{"scenario": "formal", "context": "规范新闻叙述 / 原样呈现口语引语", "ms": "Ketika ditemu bual, saksi itu berkata, “Saya tak nampak nombor pendaftaran kenderaan tersebut.”", "zh": "接受采访时，该证人说：“我没看见那辆车的车牌号码。”", "en": "When interviewed, the witness said, “I didn't see the vehicle's registration number.”"}, {"scenario": "colloquial", "context": "WhatsApp / 熟人间婉拒邀约", "ms_spoken": "Aku tak boleh ikut lah, kerja belum siap lagi.", "ms_standard": "Aku tidak dapat ikut kerana kerja masih belum siap.", "zh": "我去不了啦，活儿还没做完。", "en": "I can't come along, I've still got work to finish.", "spoken_features": ["tak = tidak；boleh 在本句表示实际能否参加，标准等义句用 dapat。", "lah 在这里软化拒绝；belum … lagi 强调到现在还没有完成。", "口语省略连接原因的 kerana，标准等义句补出。"]}], "spoken_shortcuts": [{"abbr": "tak", "full_form": "tidak", "note": "普遍口语缩短；正式论述正文通常用 tidak，保留口语引语时可用 tak。"}, {"abbr": "tk", "full_form": "tidak", "note": "聊天中对 tak 的再省写；须结合上下文。"}, {"abbr": "x", "full_form": "tidak", "note": "马来语聊天中的否定代号，如 x tahu；不是标准正字法，也不保证每个 x 都表示否定。"}, {"abbr": "xde", "full_form": "tidak ada", "note": "表示没有的聊天缩合；包含 ada，不能把整个 xde 只还原成 tak。"}], "cultural_pragmatics": {"register": "colloquial", "politeness_note": "tak 是正常口语，本身不是粗话；对长辈说 Saya tak pasti 可以很礼貌。生硬地单说 Tak! 可能显得拒人于千里，实际效果取决于语调和上下文。", "usage_etiquette": "公文、论文和考试中的正式叙述优先用 tidak；文学对话、真实口语引语可保留 tak。婉拒时补充 maaf 或简短原因，常比机械换成较长词形更有礼貌。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Malay tidak; separate sound-symbolic homonym", "root_origin": "否定义由 tidak 缩短；所给 Kaikki 将其否定词家族追溯至原始马来语 *daʔ 等形式。本批不把这一历史关系当成现代可拆词缀。敲击声名词属拟声同形词，另行理解。", "cognitive_memory_aid": "先记三个高频搭配：tak tahu 不知道、tak ada 没有、tak apa 没关系；正式表达分别回到 tidak tahu、tidak ada、tidak mengapa。"}}, {"headword": {"word": "dan", "syllables": "dan", "ipa": "/dan/", "jawi": "دان", "frequency_rank": 10, "status": "official"}, "morphology": {"is_root": true, "root_word": "dan", "affix": null, "affix_type": "none", "formula": "∅ + dan → dan", "pattern_note": "现代马来语中为独立并列连词，没有需要标注的能产词缀，dan 为单音节。不存在可据本批材料建立的派生词族；不把近义词 dengan 或 serta 当成词根派生。", "word_family": []}, "senses": [{"id": 1, "pos": "conjunction", "zh_definition": "和、与、及、并且；连接同等地位或相应性质的词、短语或分句。", "en_definition": "And; coordinates words, phrases, or clauses of equal or corresponding grammatical status.", "ms_definition": "Kata yang menghubungkan dua kata atau dua ayat.", "nuances": "这句马来语释义取自已核实的 DBP Khidmat Nasihat 答复；本批未取得 dan 的《Kamus Dewan》独立词头原文，不冒称为该版逐字引文。ibu dan ayah（母亲和父亲）、membaca dan menulis（读和写）。连接同一主语的动作时，汉语常无需逐字译出“和”。"}, {"id": 2, "pos": "conjunction", "zh_definition": "而后、接着；连接叙事中后续发生的事情，具体先后关系由语境确定。", "en_definition": "And then; introduces a subsequent event in a narrative when sequence is supplied by the context.", "ms_definition": "serta; selanjutnya; seterusnya", "nuances": "同一 DBP Khidmat Nasihat 答复列出的后续义。例如 Dia membuka pintu dan masuk 表示开门后进去；dan 本身不总是表示时间顺序或因果，不能在所有并列中都译成“然后”。"}], "dual_scenarios": [{"scenario": "formal", "context": "公告 / 学校合作活动", "ms": "Pihak sekolah dan penduduk setempat akan bekerjasama untuk menjayakan program ini.", "zh": "校方和当地居民将携手促成这项活动成功举办。", "en": "The school and local residents will work together to make this programme a success."}, {"scenario": "colloquial", "context": "WhatsApp / 请熟人买早餐", "ms_spoken": "Tolong beli roti dan telur kat kedai bawah tu, ya?", "ms_standard": "Tolong belikan roti dan telur di kedai di tingkat bawah itu.", "zh": "帮忙在楼下那家店买面包和鸡蛋，好吗？", "en": "Could you get some bread and eggs from that shop downstairs?", "spoken_features": ["kat 在地点语境下对应 di；tu = itu。", "口语中 beli 可省去标准等义句中的受益后缀 -kan。", "句尾 ya 带请求确认、缓和语气的作用；dan 本身在口语中仍可完整保留。"]}], "spoken_shortcuts": [{"abbr": "&", "full_form": "dan", "note": "聊天、笔记和某些名称中的并列符号；普通正式正文通常写 dan。"}, {"abbr": "dn", "full_form": "dan", "note": "原始 Malaya 规则记录的聊天省写，不作标准拼写。"}, {"abbr": "n", "full_form": "dan", "note": "混合语言聊天中可表示 and／dan，解释依赖上下文，不能无条件规范化。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "dan 是中性连词，适用于正式和日常语境；它不带称呼上的尊卑。列举合作者、族群或来宾时，信息是否完整、称谓是否准确比连词本身更影响观感。", "usage_etiquette": "正式列举可写 A, B dan C；若含多个层次，重组句子以免并列关系含糊。dan 表并列，dengan 常表伴随或工具，不能因为汉语都可译为“和”就任意互换。"}, "etymology": {"origin": "Uncertain", "source_language": "Not established by the supplied evidence", "root_origin": "原始材料没有提供可核验的 dan 词源。本批保留未知，不因其属于基础词汇而编造原始南岛语词根，也不随意指定外来借源；现代基本词身份不等于词源已经证实。", "cognitive_memory_aid": "记面包加鸡蛋：roti + telur → roti dan telur。把 dan 当作连接两个并列项目的“加号”；这是记忆比喻，不是词源。"}}, {"headword": {"word": "akan", "syllables": "a.kan", "ipa": "[a.kan]", "jawi": "اکن", "frequency_rank": 11, "status": "official"}, "morphology": {"is_root": true, "root_word": "akan", "affix": null, "affix_type": "none", "formula": "∅ + akan → akan", "pattern_note": "现代独立功能词，无可拆的能产词缀。ke- + akan + -an → keakanan；se- + akan-akan → seakan-akan，后者含重叠，不能理解成两个将来时。历史上与 -kan 的关系不等于现代可以随意互换。", "word_family": [{"word": "keakanan", "affix": "ke-...-an", "gloss": "未来、将来时间 / futurity; future time"}, {"word": "akan-akan", "affix": "reduplication", "gloss": "很像、近似 / resembling; much like"}, {"word": "seakan-akan", "affix": "se- + reduplication", "gloss": "仿佛、好像 / as if; seemingly"}]}, "senses": [{"id": 1, "pos": "verb", "zh_definition": "将、将要、会；放在谓语前，表示预计、预定或可能发生的事件。", "en_definition": "Will; be going to; marks an anticipated or prospective event before a predicate.", "ms_definition": "Menandai peristiwa yang dijangka berlaku kemudian. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "马来语语法中的 kata bantu aspek；Schema 没有 auxiliary，归 verb。不是动词变位，也不是每个将来语境都必须出现。Saya akan datang esok 表示我明天会来；否定通常为 tidak akan datang。口语 nak 常表意愿或即将，不能在所有预测句里替换 akan。"}, {"id": 2, "pos": "preposition", "zh_definition": "引出感情、记忆、意识等所指向的人或事物，相当于对、对于，译成汉语时也常不单独译出。", "en_definition": "Introduces the object or target of an emotion, recollection, or awareness.", "ms_definition": "Mengaitkan predikat tertentu dengan sasaran perasaan atau ingatan. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "如 sayang akan keluarga、teringat akan ibu、lupa akan janji；这里不表示将来。规范语法尤其常用于表示感情或态度的词后；不能据此在每个及物动词与宾语间插入 akan，普通 membeli buku 不写成 membeli akan buku。"}, {"id": 3, "pos": "preposition", "zh_definition": "给、为、替；用于引出受益者，主要见于古典或文学表达。", "en_definition": "For; introduces a beneficiary in literary or older usage.", "ms_definition": "bagi, buat, pada, untuk", "nuances": "DBP《Kamus Dewan》第四版义项摘录。日常表达“给我买一本书”宜说 belikan saya sebuah buku 或 beli sebuah buku untuk saya；旧式 beli buku akan daku 应作为阅读识别用法。"}, {"id": 4, "pos": "preposition", "zh_definition": "至于、关于、说到；用于引入话题，具有古典或文学色彩。", "en_definition": "As for; concerning; introduces a topic in literary or older prose.", "ms_definition": "adapun, perihal, mengenai, tentang", "nuances": "DBP《Kamus Dewan》第四版义项摘录。不可把篇首话题标记一律译成 will；现代公文通常选用 mengenai 或 tentang。"}, {"id": 5, "pos": "conjunction", "zh_definition": "在固定连接语 akan tetapi 中表示但是、然而，引出转折。", "en_definition": "In the fixed expression akan tetapi: but; however.", "ms_definition": "Menghubungkan dua perkara yang berlawanan dalam ungkapan akan tetapi. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "此义属于整个 akan tetapi，不是孤立 akan 的普通词义；此处也不是将来标记加 tetapi。新闻及论说文可用，口语更常用 tapi。"}], "dual_scenarios": [{"scenario": "formal", "context": "新闻 / 公共设施启用公告", "ms": "Perpustakaan baharu itu akan dibuka kepada orang ramai pada bulan hadapan.", "zh": "那座新图书馆将于下个月向公众开放。", "en": "The new library will open to the public next month."}, {"scenario": "colloquial", "context": "WhatsApp / 朋友确认明天的行程", "ms_spoken": "Esok saya akan sampai awal sikit. Nanti kita sarapan dulu lah.", "ms_standard": "Esok saya akan tiba sedikit lebih awal. Kemudian, kita bersarapan dahulu.", "zh": "明天我会早到一点。到时咱们先吃早餐吧。", "en": "I'll get there a bit early tomorrow. Let's have breakfast first when I arrive.", "spoken_features": ["sikit = sedikit；sampai 在这里口语表示到达，规范对应 tiba。", "nanti 在这里指明天到达之后；dulu = dahulu。", "lah 在这里使提议显得随和；完整 akan 在日常聊天里同样自然。"]}], "spoken_shortcuts": [{"abbr": "akn", "full_form": "akan", "note": "省略元音的短信写法；正式文字保留 akan。"}, {"abbr": "kan", "full_form": "akan", "note": "词典记录的缩短形式，须由具体句法判别；句尾 kan? 常是寻求认同的语气词，不能一律展开为 akan。"}, {"abbr": "takkan", "full_form": "tidak akan", "note": "组合缩合形式，常见于聊天及对白；也可表达“难道／不至于吧”的反问，不能当作单独 akan 的缩写。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "akan 本身无尊卑差异。Saya akan semak dahulu 表示将先核查，适合工作沟通；说出 akan 并不自动构成郑重承诺，确定程度仍依上下文。", "usage_etiquette": "工作安排可用 akan，表达意愿时区分 mahu／hendak，表示能力时用 boleh。对长辈或客户使用合适称呼，如 Puan、Encik；不因句子带正式 akan 就认为 kau 也变得礼貌。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Classical Malay; Proto-Malayo-Polynesian", "root_origin": "本地 Kaikki 记为承自古典马来语 akan，并追溯到重建形式 *akən，历史上与 -kan 有关。重建形式带 *，不当作已见于现代文献的拼写；现代 akan 是独立词。", "cognitive_memory_aid": "把时间轴往前推：akan datang = 将会到来；另记 sayang akan ibu = 爱妈妈，此处 akan 连接感情对象，不表示将来。"}}, {"headword": {"word": "tidak", "syllables": "ti.dak", "ipa": "[ˈti.daʔ]", "jawi": "تيدق", "frequency_rank": 12, "status": "official"}, "morphology": {"is_root": true, "root_word": "tidak", "affix": null, "affix_type": "none", "formula": "∅ + tidak → tidak", "pattern_note": "现代否定词整词记忆；口语 tidak → tak 为缩短而非加缀。meN- (men-) + tidak + -kan → menidakkan，词首 t 脱落；peN- (pen-) + tidak + -an → penidakan，同样脱落 t。ke- + tidak + seimbang + -an → ketidakseimbangan 是对 tidak seimbang 的名词化，不把 ketidak 当作独立词根。", "word_family": [{"word": "menidakkan", "affix": "meN-...-kan", "gloss": "否认、说不存在或不成立 / deny; negate"}, {"word": "penidakan", "affix": "peN-...-an", "gloss": "否认、否定这一行为 / denial; negation"}, {"word": "setidak-tidaknya", "affix": "se- + reduplication + -nya", "gloss": "至少、无论如何 / at least; in any case"}, {"word": "ketidakseimbangan", "affix": "ke- + tidak + seimbang + -an", "gloss": "不平衡 / imbalance"}]}, "senses": [{"id": 1, "pos": "adverb", "zh_definition": "不、没（有）；通常放在动词、形容词及某些助动词前，否定动作、状态或可能性。", "en_definition": "Not; normally negates a verb, adjective, or certain auxiliary predicates.", "ms_definition": "tiada; bukan", "nuances": "所给 DBP《Kamus Pelajar》第二版释义摘录；实际句法不能因此与 bukan 任意互换。tidak datang = 不来／没来，tidak mahal = 不贵，tidak boleh = 不能／不许。普通名词身份用 bukan，如 bukan doktor；归属否定用 bukan milik saya。bukan 也可用于对照纠正，不把规则说成绝无例外。时间由上下文决定，不单靠 tidak 区分过去和现在。"}, {"id": 2, "pos": "particle", "zh_definition": "作为简短否定回答，表示不、没有、不是所问的情况；所否定的谓语由前文补出。", "en_definition": "No; a short negative answer with the predicate understood from context.", "ms_definition": "Jawapan ringkas yang menafikan perkara yang ditanya. (Takrif editorial berdasarkan fungsi penafian tidak.)", "nuances": "例如 Sudah siap? — Tidak, belum siap. 日常更自然也可只答 Belum；问 Ini buku awak? 时通常答 Bukan，而不是机械以 Tidak 回答所有 yes/no 问题。固定表达 tidak apa（没关系）和 tidak boleh tidak（非得、必须）须按整体理解。"}], "dual_scenarios": [{"scenario": "formal", "context": "公文 / 申请受理规定", "ms": "Permohonan yang tidak lengkap tidak akan diproses.", "zh": "资料不完整的申请将不予处理。", "en": "Incomplete applications will not be processed."}, {"scenario": "colloquial", "context": "WhatsApp / 同事解释暂时无法赴约", "ms_spoken": "Saya tak boleh datang hari ni, kerja belum siap lagi lah.", "ms_standard": "Saya tidak boleh datang hari ini kerana kerja saya masih belum siap.", "zh": "我今天来不了啦，工作还没做完。", "en": "I can't make it today; I still haven't finished my work.", "spoken_features": ["tak = tidak，日常口语常用。", "ni = ini；口语省略明确的因果连接词 kerana。", "lah 在这里作解释和缓和；belum...lagi 表示仍未完成，不等于简单过去否定。"]}], "spoken_shortcuts": [{"abbr": "tak", "full_form": "tidak", "note": "大马日常口语常用；规范公文通常用完整 tidak，文学对白可保留 tak。"}, {"abbr": "tdk", "full_form": "tidak", "note": "省略元音的聊天或速记形式；不是口头读音。"}, {"abbr": "x", "full_form": "tidak", "note": "非正式聊天中的否定符号；按上下文也可能相当于 tak 或别的否定表达，不是正式正字法。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "tidak 并非粗话，但单独、硬声地回答 Tidak! 可能显得生硬。对客户或长辈拒绝请求可说 Maaf, saya tidak dapat...；礼貌不只取决于把 tak 换成 tidak。", "usage_etiquette": "否定动作或性质先学 tidak；否定名词身份先学 bukan；表示尚未用 belum；劝阻命令用 jangan。聊天中 tak 自然，但不要把印尼 nggak／enggak、英语 isn't 当作本词的大马常用缩写。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Malay; Proto-Malayic", "root_origin": "Kaikki 将 tidak 联系到早期 tida／tiada，以及原始马来语否定成分 *ti 与存在词 *ada(ʔ)。这是历史分析，现代使用不要求先拆成 ti + ada；所给古碑首见年份未独立核验，故不作确定断言。", "cognitive_memory_aid": "记一组对照：tidak datang（不来）、bukan guru（不是老师）、belum datang（还没来）、jangan datang（别来）。"}}, {"headword": {"word": "kita", "syllables": "ki.ta", "ipa": "/ˈkitə/", "jawi": "کيت", "frequency_rank": 13, "status": "official"}, "morphology": {"is_root": true, "root_word": "kita", "affix": null, "affix_type": "none", "formula": "∅ + kita → kita", "pattern_note": "独立代词，不由 ki- + ta 派生，也不因句中作主语、宾语或领属语而变形。kita punya 是口语领属结构，不是后缀派生；没有必要为本词生造派生词族。", "word_family": []}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "我们、咱们；规范核心用法包括说话者和听话者，双方可各自再包括其他人。", "en_definition": "We; us; the inclusive first-person plural, including the speaker and the addressee.", "ms_definition": "saya dan kamu semua", "nuances": "DBP《Kamus Pelajar》第二版。kita 包括听者，kami 在规范用法中排除听者；不是“kita 少数人、kami 多数人”。Kita pergi bersama-sama 可以只指我和你，也可以包括更大群体。南部半岛常读 /ˈkitə/，其他口音及逐字读法可为 /ˈkita/。"}, {"id": 2, "pos": "pronoun", "zh_definition": "我们的、咱们的；放在名词后表示包括听者在内的领属或关联。", "en_definition": "Our; ours; an inclusive possessor following a noun.", "ms_definition": "Menunjukkan pemilik atau pihak yang termasuk penutur dan pendengar. (Takrif editorial bagi fungsi milik kata ganti kita.)", "nuances": "如 rumah kita（我们的家）、negara kita（我们的国家）。不是不同的代词变格；不需要仿英语另造 our 形式。与 rumah kami 的分别仍在于是否包括听者。"}, {"id": 3, "pos": "pronoun", "zh_definition": "我；在特定亲近、柔和的口语互动中用作第一人称单数自称。", "en_definition": "I; me; an informal singular self-reference in some familiar interactions.", "ms_definition": "saya; aku", "nuances": "DBP《Kamus Pelajar》第二版列有此义。是否指一个人必须看语境；不宜把这种自称说成所有女性的习惯，也不把男性使用它视为错误。面试、办事或跨关系沟通，明确自称我时先选 saya。"}, {"id": 4, "pos": "pronoun", "zh_definition": "部分非正式用法中也泛指不包括听者的我们，偏离规范的 kita／kami 区分。", "en_definition": "We; us excluding the addressee in some informal usage.", "ms_definition": "Dalam sesetengah percakapan, merujuk kelompok penutur tanpa pendengar. (Takrif editorial berdasarkan Kaikki.)", "nuances": "只作语用识别，不作为规范替代规则；对外说明本公司、本团队做了什么而听者不在其中时，用 kami 更清楚。与上述包括听者的核心义分列，避免学习者混用。"}, {"id": 5, "pos": "pronoun", "zh_definition": "在文莱特定礼貌用法及部分古语中，指你、您；不是马来西亚全国通用的第二人称形式。", "en_definition": "You, in a Brunei respectful usage and in some archaic usage.", "ms_definition": "Kata sapaan orang kedua dalam penggunaan Brunei tertentu atau bahasa lama. (Takrif editorial berdasarkan Kaikki.)", "nuances": "仅供跨地区和旧文阅读识别；在大马日常对话里，不能把 kita 随意替换为 awak 或 kamu。礼貌效力依当地称呼系统而定。"}], "dual_scenarios": [{"scenario": "formal", "context": "公共演讲 / 社区合作", "ms": "Kita perlu bekerjasama untuk memastikan keselamatan penduduk sentiasa terpelihara.", "zh": "我们需要携手合作，确保居民的安全始终受到保障。", "en": "We must work together to ensure that residents remain safe."}, {"scenario": "colloquial", "context": "朋友约饭 / 下班后一起行动", "ms_spoken": "Jom, kita makan kat kedai depan tu dulu.", "ms_standard": "Mari kita makan di kedai di hadapan itu dahulu.", "zh": "走，咱们先去前面那家店吃点东西。", "en": "Come on, let's eat at that place up ahead first.", "spoken_features": ["jom = mari，邀请听者一起行动。", "kat 在此表示地点，对应 di；tu = itu；dulu = dahulu。", "kita 包括正在被邀请的朋友，不是排除对方的 kami。"]}], "spoken_shortcuts": [{"abbr": "kite", "full_form": "kita", "note": "反映词尾 /ə/ 的非正式拼写，见于半岛部分口音的聊天；不改变标准拼写。"}, {"abbr": "kta", "full_form": "kita", "note": "省略元音的速记形式，须靠上下文判断；不当作规范拼写。"}, {"abbr": "kito", "full_form": "kita", "note": "区域方言写法，含义和人称范围依具体方言；不推广为全国统一缩写。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "kita 常营造共同参与感，适合向各族群居民发出合作邀请。若听者并未同意参加，却说 Kita dah setuju（我们都同意了），可能把他人强行纳入共识。", "usage_etiquette": "说“我们欢迎您”且您不属于接待方时，用 Kami mengalu-alukan kedatangan tuan／puan；说“让我们一起开始”则用 Mari kita mulakan。不要因为对方是马来人或华人就擅自判定其亲密自称习惯。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Malayic; Proto-Austronesian", "root_origin": "Kaikki 追溯到原始马来语 *kita(ʔ)、原始马来－波利尼西亚语及原始南岛语 *(i-)kita，属于继承的代词。现代不拆成 ki + ta。", "cognitive_memory_aid": "想象把说话者和听者一起圈进去：kita = 咱们；圈住说话者一方而把听者留在圈外：kami = 我们。"}}, {"headword": {"word": "apa", "syllables": "a.pa", "ipa": "/ˈapə/", "jawi": "اڤ", "frequency_rank": 14, "status": "official"}, "morphology": {"is_root": true, "root_word": "apa", "affix": null, "affix_type": "none", "formula": "∅ + apa → apa", "pattern_note": "独立疑问词。apa + -kah → apakah，-kah 是疑问附着词；apa + apa → apa-apa 为重叠。meng- + apa → mengapa 与 ber- + apa → berapa 是已词汇化的疑问词关系，不应据此把普通 meN-／ber- 的所有功能都套到它们身上。", "word_family": [{"word": "apakah", "affix": "-kah (particle)", "gloss": "什么；是否 / what; whether"}, {"word": "apa-apa", "affix": "reduplication", "gloss": "任何事物；某件事物 / anything; something"}, {"word": "mengapa", "affix": "meng- (lexicalized)", "gloss": "为什么 / why"}, {"word": "berapa", "affix": "ber- (lexicalized)", "gloss": "多少 / how much; how many"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "什么；询问事物、身份类别、内容或所发生的事情。", "en_definition": "What; asks about a thing, its identity or kind, or what happens.", "ms_definition": "kata yg digunakan untuk menanyakan sesuatu", "nuances": "DBP《Kamus Pelajar》第二版。日常 Apa nama awak?（你叫什么名字？）自然，规范提问可写 Apakah nama anda?；不把 apa 一概译成“为什么”。Apa khabar? 是问候“你好吗／近况怎样”，不逐词译成“什么消息”。南部半岛 /ˈapə/ 与 /ˈapa/ 都有使用。"}, {"id": 2, "pos": "pronoun", "zh_definition": "在嵌入结构 apa yang... 中指所……的事物、……什么。", "en_definition": "What; that which; introduces the content of an embedded question or a free relative construction.", "ms_definition": "Merujuk perkara dalam binaan apa yang diikuti penerangan. (Takrif editorial berdasarkan Kaikki dan contoh yang dibekalkan.)", "nuances": "Saya faham apa yang dimaksudkan = 我明白所指的意思；Saya tidak tahu apa yang berlaku = 我不知道发生了什么。yang 是此结构的一部分，不能把 apa 当成任意关系连词套用到指人的 who。"}, {"id": 3, "pos": "particle", "zh_definition": "什么？啊？用于表示惊讶、难以置信、没听清，或直截了当地询问对方要什么。", "en_definition": "What?; an exclamation of surprise, disbelief, or a request for repetition or clarification.", "ms_definition": "Seruan atau pertanyaan pendek untuk menyatakan terkejut, meminta pengulangan atau penjelasan. (Takrif editorial berdasarkan Kaikki.)", "nuances": "Schema 无 interjection，归 particle。单独 Apa? 若语调硬，可能显得不耐烦或挑衅；没听清时对陌生人宜说 Maaf, boleh ulang?，接待别人可问 Ada apa yang boleh saya bantu?。"}, {"id": 4, "pos": "particle", "zh_definition": "口语中用来引出是否疑问或带反问的确认，约相当于是不是、难道；规范语体常改用 adakah。", "en_definition": "Introduces an informal yes-or-no question, often with an emphatic or rhetorical tone.", "ms_definition": "Membuka pertanyaan tentang benar atau tidaknya sesuatu perkara. (Takrif editorial berdasarkan Kaikki.)", "nuances": "如 Apa dia dah sampai? 在相应口语中可问“他已经到了吗？”；正式写作宜用 Adakah dia sudah tiba?。不要把这种语序误当作疑问代词“什么”的唯一用法。"}, {"id": 5, "pos": "particle", "zh_definition": "口语中用于停顿回想、试探性猜测或表达近似，具体解释取决于所在结构。", "en_definition": "A conversational hesitation or approximation marker while recalling or guessing information.", "ms_definition": "Penanda jeda ketika mengingat atau mengagak sesuatu dalam percakapan. (Takrif editorial berdasarkan Kaikki.)", "nuances": "如 Dia tinggal kat... apa... Shah Alam, kan? 中 apa 标记回想停顿；不把停顿词当成一个需要逐字译出的“什么”。不用于正式公文。"}, {"id": 6, "pos": "conjunction", "zh_definition": "或、还是；少见的口语选择连接用法，规范表达通常用 atau。", "en_definition": "Or; an uncommon conversational connector between alternatives.", "ms_definition": "Penghubung pilihan yang bermaksud atau. (Takrif editorial berdasarkan Kaikki; penggunaan tidak lazim.)", "nuances": "仅作识别；并非每个 apa 都能换成 atau，正式写作与初学者主动表达优先用 atau。另有 apa boleh buat（没办法了）、apa saja／apa sahaja（任何东西）等固定结构，应整体理解。"}], "dual_scenarios": [{"scenario": "formal", "context": "课堂 / 讨论报告结论", "ms": "Sila jelaskan apa yang dimaksudkan dengan pembangunan mampan dalam laporan ini.", "zh": "请解释本报告中可持续发展的含义。", "en": "Please explain what is meant by sustainable development in this report."}, {"scenario": "colloquial", "context": "朋友约饭 / WhatsApp 聊天", "ms_spoken": "Nak makan apa malam ni? Jom makan kat luar.", "ms_standard": "Hendak makan apa malam ini? Mari kita makan di luar.", "zh": "今晚想吃什么？走，出去吃吧。", "en": "What do you feel like eating tonight? Let's eat out.", "spoken_features": ["nak = hendak，口语询问意愿，省略可由语境补出的主语。", "ni = ini；jom = mari；kat 在此相当于地点介词 di。", "apa 仍作疑问词，没有因口语形式而改成英语 what。"]}], "spoken_shortcuts": [{"abbr": "ape", "full_form": "apa", "note": "反映部分半岛口音词尾 /ə/ 的聊天写法；正式拼写用 apa。"}, {"abbr": "apo", "full_form": "apa", "note": "见于部分区域方言的书写，需依地区辨认；不是全国统一发音或标准缩写。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "Apa khabar? 是跨族群均可使用的常见问候。单独、高声的 Apa? 容易显得冲；对师长、客户或陌生人没听清时，用 Maaf, boleh ulang sekali lagi? 更稳妥。", "usage_etiquette": "询问姓名可以用 Boleh saya tahu nama encik／puan?；紧接着再用适当称呼。apa 不自带冒犯，关键是语调、句型和互动关系；不要仅凭对方族群决定能否用粗直的问法。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Malayic; Proto-Malayo-Polynesian", "root_origin": "Kaikki 追溯至原始马来语及原始马来－波利尼西亚语 *apa；属于继承疑问词。与 Māori aha 的比较是语言亲缘线索，不是现代借词关系。", "cognitive_memory_aid": "串成一个问句家族：apa 什么，mengapa 为什么，berapa 多少；把 Apa khabar? 作为整句问候记住。"}}, {"headword": {"word": "kamu", "syllables": "ka.mu", "ipa": "/kamu/", "jawi": "کامو", "frequency_rank": 15, "status": "official"}, "morphology": {"is_root": true, "root_word": "kamu", "affix": null, "affix_type": "none", "formula": "∅ + kamu → kamu", "pattern_note": "独立第二人称代词；不分析成 ka- + mu。kamu 的主语、宾语、领属形式不变；-mu 是相关的代词附着形式，写在所依附词之后。ber- + kamu → berkamu 指以 kamu 称呼别人。kau 来自 engkau 的缩短，不能当成 kamu 的直接删音。", "word_family": [{"word": "berkamu", "affix": "ber-", "gloss": "使用 kamu 称呼对方 / address someone as kamu"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "你；对单个听话者的第二人称称呼，常见于熟悉关系或对晚辈的说话场景；也可在名词后表示你的。", "en_definition": "You, singular; also your when used after a noun; often familiar or addressed to someone younger.", "ms_definition": "kata ganti diri kedua (orang yg menjadi lawan bercakap), awak, engkau", "nuances": "DBP《Kamus Dewan》第四版。buku kamu = 你的书；Saya nampak kamu = 我看见你，不像英语区分 you／your。可见于家长对孩子、老师对学生或已形成这种称呼习惯的关系；并非对所有同辈或陌生人都中性。"}, {"id": 2, "pos": "pronoun", "zh_definition": "你们；称呼多个听话者，常加 semua 或 sekalian 来明确复数。", "en_definition": "You, plural; you all, often made explicit with semua or sekalian.", "ms_definition": "engkau sekalian, engkau (awak) semua", "nuances": "DBP《Kamus Dewan》第四版。kamu 既可单数也可复数，不能只靠词形判断；Kamu semua sudah bersedia? 面向整个群体。正式面向成年听众时可用 tuan-tuan dan puan-puan 或适当群体称呼。"}], "dual_scenarios": [{"scenario": "formal", "context": "课堂 / 教师向学生说明实验要求", "ms": "Kamu semua perlu mematuhi arahan keselamatan sebelum memulakan eksperimen ini.", "zh": "你们所有人都须在开始本次实验之前遵守安全指示。", "en": "You must all follow the safety instructions before beginning this experiment."}, {"scenario": "colloquial", "context": "家庭 / 家长接孩子放学", "ms_spoken": "Kamu dah makan ke? Kalau belum, jom makan dulu.", "ms_standard": "Adakah kamu sudah makan? Jika belum, mari kita makan dahulu.", "zh": "你吃了吗？还没的话，来，先吃饭。", "en": "Have you eaten yet? If not, let's eat first.", "spoken_features": ["dah = sudah；句尾 ke 在这里构成口语是否问句，规范对应 adakah。", "jom = mari；dulu = dahulu。", "家长对孩子用 kamu 在本场景自然，不能推论学生也适合这样称呼老师。"]}], "spoken_shortcuts": [{"abbr": "kmu", "full_form": "kamu", "note": "短信中省略元音的写法；不改变称呼所带的关系和语气。"}, {"abbr": "-mu", "full_form": "kamu", "note": "相关的代词附着形式，如 bukumu；不只限于短信，也见于规范及文学书写，不宜当成可独立书写的普通简称。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "老师对学生、父母对孩子用 kamu 通常自然；学生、下属或初次见面的成年人反向使用，可能被听成居高临下或 kurang ajar。对老师用 cikgu，对成年陌生人先用 encik／puan，对有职衔者用适当职衔；熟人之间遵循双方既有习惯。", "usage_etiquette": "awak 在部分同辈关系里较柔和，但也不是面对所有上司、长辈的万能安全词；anda 适合一般告示和面向大众的文字，面谈常用称呼更自然。kau／ko、北部 hang、lu 是不同来源或语域的代词，不能作为 kamu 的直接缩写清单。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Malayic; Proto-Austronesian", "root_origin": "Kaikki 联系到原始马来语 *kamu(ʔ) 及更早的 *(i-)kamu／*kamiu。它是继承代词，不是从现代 -mu 倒推新造的词；原材料的古碑年代未独立核实，不在词条断言首见年份。", "cognitive_memory_aid": "把 Kamu semua! 与老师面对全班的画面关联：可以是一个你，也可以是一群你们；记称呼方向，别把老师对学生的用法直接反过来。"}}, {"headword": {"word": "itu", "syllables": "i.tu", "ipa": "/itu/", "jawi": "ايت", "frequency_rank": 16, "status": "official"}, "morphology": {"is_root": true, "root_word": "itu", "affix": null, "affix_type": "none", "formula": "∅ + itu → itu", "pattern_note": "独立指示词。itu + -lah → itulah，-lah 是强调附着词；口语 itu → tu 是省去起首元音，不是加缀。不能因为 ايتوله 的连写形态就把原词 Jawi 猜写成 ايتو。", "word_family": [{"word": "itulah", "affix": "-lah (particle)", "gloss": "就是那个；正是如此 / that very one; that is how it is"}]}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "那、那个、那些；指离说话者较远的人、物、地方或时间，既可独立指示，也可后置限定名词。", "en_definition": "That or those; a distal demonstrative used independently or after a noun.", "ms_definition": "kata penunjuk utk benda (hal, tempat, waktu) yg jauh, lwn ini", "nuances": "DBP《Kamus Dewan》第四版核心定义摘录。Schema 无 determiner，独立与限定用法均归 pronoun。Buku itu（那本书）中指示词后置；itu 不标单复数。词尾 u 虽不写在此独立词的 Jawi 中，Rumi 及读音仍为 itu。"}, {"id": 2, "pos": "pronoun", "zh_definition": "指已经提及、双方知道或在叙述中可识别的那个人、事物或情况；也可表示那个时候。", "en_definition": "Refers back to an already mentioned or identifiable person, thing, situation, or time.", "ms_definition": "Menunjuk perkara atau masa yang telah dikenal dalam konteks. (Olahan penggunaan kata penunjuk berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "此为同一指示词的话语用法，不要求物理距离很远；perkara itu = 那件事，ketika itu = 当时。不是英语 that 的所有语法功能：Saya tahu bahawa... 的“知道……这件事”不能机械换成 itu。itu dia、itu pun、oleh itu 需按固定结构理解。"}], "dual_scenarios": [{"scenario": "formal", "context": "新闻 / 地方发展报道", "ms": "Projek itu dijangka siap menjelang akhir tahun hadapan.", "zh": "该项目预计将在明年年底之前完成。", "en": "That project is expected to be completed by the end of next year."}, {"scenario": "colloquial", "context": "日常购物 / 熟人挑选商品", "ms_spoken": "Yang tu cantik lah. Ambil yang tu je.", "ms_standard": "Yang itu cantik. Ambil yang itu sahaja.", "zh": "那个挺好看的，就拿那个吧。", "en": "That one's nice. Just get that one.", "spoken_features": ["tu = itu，常见日常缩短。", "je = sahaja，在这里表示就选那一个。", "lah 在这里加强随和的评价，不改变指示对象。"]}], "spoken_shortcuts": [{"abbr": "tu", "full_form": "itu", "note": "日常口语及聊天常见；正式文书用 itu。"}, {"abbr": "tuh", "full_form": "itu", "note": "非标准聊天写法，可能加强指示语气；不作为全国统一发音。"}, {"abbr": "tuu", "full_form": "itu", "note": "延长元音的聊天写法，常带强调或指远意味。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "itu 是普通指示词；但当面指着一位人只说 yang itu，可能显得把对方当物品挑选。介绍或询问长辈、客户时加称呼，如 Encik Tan itu 或 Puan yang di kaunter itu。", "usage_etiquette": "记名词后置 buku itu。正式文字写 itu，聊天常说 tu。that／those 属英语翻译或语码转换，不是马来语缩写；itu dia 若带嘲讽语气也可能近于“这下可好了／活该”，不总是中性的“他在那里”。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Malayic; Proto-Austronesian", "root_origin": "Kaikki 追溯至原始马来语 *(i)tu(ʔ)、原始马来－波利尼西亚语 *(i-)tu 和原始南岛语 *(i-)Cu。比较词在亲属语言中可能表示近指，不意味着现代 Malay itu 也等于 this。", "cognitive_memory_aid": "指近处说 ini，指远处说 itu；再把前文提过的“那件事”接上 perkara itu，记住也能指话语中的旧信息。"}}, {"headword": {"word": "untuk", "syllables": "un.tuk", "ipa": "[ˈʔun.tuʔ]", "jawi": "اونتوق", "frequency_rank": 17, "status": "official"}, "morphology": {"is_root": true, "root_word": "untuk", "affix": null, "affix_type": "none", "formula": "∅ + untuk → untuk", "pattern_note": "现代基本词，不能因首字母相似而拆成英语 un-。meN- (meng-) + untuk + -kan → menguntukkan；memper- + untuk + -kan → memperuntukkan；per- + untuk + -an → peruntukan。原词尾 k 与 -kan 起首 k 在 menguntukkan 等形式中均保留。", "word_family": [{"word": "menguntukkan", "affix": "meN-...-kan", "gloss": "分配、指定用途 / allot; earmark"}, {"word": "memperuntukkan", "affix": "memper-...-kan", "gloss": "拨出、划定专用 / allocate; set aside"}, {"word": "peruntukan", "affix": "per-...-an", "gloss": "拨款、配额；法律条款 / allocation; legal provision"}, {"word": "teruntuk", "affix": "ter-", "gloss": "已指定给、专供 / designated for"}]}, "senses": [{"id": 1, "pos": "preposition", "zh_definition": "给、供、为……而设；表示某物被分配给某人，或供某对象使用，也可引出某种适合与否的对象。", "en_definition": "For; intended, allocated, or suitable for a person, group, or use.", "ms_definition": "ditentukan (disediakan) bagi, merupakan bahagian (seseorang dll)", "nuances": "DBP《Kamus Dewan》第四版，去除原文排版断字。hadiah untuk ibu = 给妈妈的礼物；terlalu kecil untuk saya = 对我来说太小。untuk 本身不等于物主代词“属于”；领属结构和预定受益者须看上下文。"}, {"id": 2, "pos": "preposition", "zh_definition": "为了、用来、以便；引出用途、行动目的或要达到的目标，后可接动词短语。", "en_definition": "To; in order to; for the purpose of an action or intended use.", "ms_definition": "guna, bagi, buat; supaya, supaya dapat", "nuances": "合并 DBP《Kamus Dewan》第四版用途及目的相关义项。wang untuk membeli makanan（买食物的钱）、datang untuk membantu（来帮忙）。这里的 to 不是方向介词 ke；去学校用 ke sekolah。此 Schema 下沿词典介词用法归 preposition，不把所有后接动词的 untuk 都当英语不定式词尾。"}, {"id": 3, "pos": "preposition", "zh_definition": "当作、用作；表示把某物用于某种身份或功能。", "en_definition": "As; for use in a particular capacity or function.", "ms_definition": "(digunakan, dipakai) sebagai, dijadikan, supaya menjadi atau dijadikan", "nuances": "DBP《Kamus Dewan》第四版。用于说明原料、工具等的用途；现代清晰表达也常用 sebagai，如 digunakan sebagai ubat。不是在任何“甲是乙”句里都用 untuk 作系词。"}, {"id": 4, "pos": "preposition", "zh_definition": "用于引出意图中或被条件限制的动作，汉语常译为要、去、来，如太害怕而不敢逃跑。", "en_definition": "Introduces an intended or contemplated action, including after expressions of readiness, fear, or degree.", "ms_definition": "(bermaksud) hendak", "nuances": "DBP《Kamus Dewan》第四版。terlalu takut untuk lari = 太害怕，不敢逃跑；bersedia untuk bertugas = 准备好执行任务。与目的义相关，但不是所有这种句子都表示“为了”。"}, {"id": 5, "pos": "preposition", "zh_definition": "给、向；跟随寄送、给予等动作，引出预定收取者或受益者。", "en_definition": "For; to; marks the intended recipient or beneficiary of something sent or given.", "ms_definition": "(diberikan, dihantar) kepada", "nuances": "DBP《Kamus Dewan》第四版。wang untuk ayah 可以是给父亲的钱；强调动作的接收对象时常用 kepada，如 menghantar wang kepada ayah。不能因此把所有 kepada 的用法都换成 untuk。"}, {"id": 6, "pos": "preposition", "zh_definition": "在部分用法中表示预定或持续的时段，相当于为期；纯粹说明持续多久时，规范而清楚的表达通常用 selama。", "en_definition": "For a stated period, especially an intended span; selama is often clearer for elapsed or continuous duration.", "ms_definition": "Menunjukkan tempoh tertentu dalam sesetengah penggunaan. (Takrif editorial berdasarkan Kaikki.)", "nuances": "此持续时长义由 Kaikki 补充，不冒称本批 Kamus Dewan 原义。预订房间 untuk dua malam 可理解为订两晚；连续工作两小时宜说 bekerja selama dua jam。不能从英语 for 反推所有时长结构都必须用 untuk。"}], "dual_scenarios": [{"scenario": "formal", "context": "公文 / 社区设施拨款说明", "ms": "Peruntukan tambahan disediakan untuk membaik pulih kemudahan awam di kawasan itu.", "zh": "已安排额外拨款，用于修缮该地区的公共设施。", "en": "Additional funding has been allocated to repair public facilities in that area."}, {"scenario": "colloquial", "context": "家庭 / 分配打包的食物", "ms_spoken": "Yang ni untuk mak, yang tu untuk kita. Jangan habiskan semua lah.", "ms_standard": "Yang ini untuk ibu, manakala yang itu untuk kita. Jangan habiskan semuanya.", "zh": "这份给妈妈，那份是咱们的。别全吃光啦。", "en": "This one's for Mum, and that one's for us. Don't eat it all.", "spoken_features": ["ni = ini；tu = itu；mak 为常见亲属称呼，对应此处的 ibu。", "口语并列省略 manakala；lah 在这里缓和提醒。", "untuk 保留完整形式，展示口语不必把每个词都缩短。"]}], "spoken_shortcuts": [{"abbr": "utk", "full_form": "untuk", "note": "聊天、笔记中常见的缩写；正式完整句子写 untuk。"}, {"abbr": "untk", "full_form": "untuk", "note": "省略一个元音的聊天写法，仍非标准拼写。"}, {"abbr": "ntuk", "full_form": "untuk", "note": "省略词首元音的非正式写法，不作为规范读音。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "untuk 本身无尊卑差别。Borang ini untuk puan 使用称呼而非 kamu，适合服务场景；给礼物时 Ini untuk encik 自然、直接。", "usage_etiquette": "写公文时保留完整 untuk。不要把英语 for 的每一种功能都映射过来；持续时长优先辨认 selama，接收对象辨认 kepada，目的辨认 untuk，距离和行进方向辨认 ke。"}, "etymology": {"origin": "Uncertain", "source_language": "Malay; earlier source unverified", "root_origin": "本批材料未提供可靠词源，未核实更早来源。可确定现代词族围绕 untuk 构成；不能仅因它是基本词就断言某个原始南岛语词形，也没有证据将其拆成外来词缀。", "cognitive_memory_aid": "把“贴用途标签”的画面记住：untuk ibu 给妈妈，untuk belajar 用来学习；再记 peruntukan 是已经划定用途的拨款或配额。"}}, {"headword": {"word": "ada", "syllables": "a.da", "ipa": "/ˈadə/", "jawi": "اد", "frequency_rank": 18, "status": "official"}, "morphology": {"is_root": true, "root_word": "ada", "affix": null, "affix_type": "none", "formula": "∅ + ada → ada", "pattern_note": "基本存在词。ber- + ada → berada；meN- (meng-) + ada + -kan → mengadakan；ke- + ada + -an → keadaan。ada + -kah → adakah 与 ada + -lah → adalah 涉及附着词及词汇化功能，不能把 -kah／-lah 当成普通派生后缀。", "word_family": [{"word": "berada", "affix": "ber-", "gloss": "处于、位于；富裕 / be situated; be well-off"}, {"word": "mengadakan", "affix": "meN-...-kan", "gloss": "举办；提供；使存在 / organize; provide; bring into existence"}, {"word": "keadaan", "affix": "ke-...-an", "gloss": "情况、状态 / condition; circumstances"}, {"word": "adakah", "affix": "-kah (particle)", "gloss": "是否、有没有 / whether; is there"}, {"word": "adalah", "affix": "-lah (particle; lexicalized)", "gloss": "用于特定说明性判断结构 / a copular or declarative form in specified constructions"}]}, "senses": [{"id": 1, "pos": "verb", "zh_definition": "有、存在；表示某人或某事物确实存在，或出现可供注意的事情。", "en_definition": "Exist; there is or there are; introduces an entity or matter that exists or is available.", "ms_definition": "Menyatakan kewujudan sesuatu atau adanya perkara untuk diperhatikan. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "涵盖 DBP 存在与有事情待处理的相关义项；Ada masalah = 有问题，Ada tiga pilihan = 有三个选择。ada 不等于所有英语 be：Saya guru（我是老师）和 Dia tinggi（他高）通常不用 ada。南部半岛常读 /ˈadə/，另有 /ˈada/。"}, {"id": 2, "pos": "verb", "zh_definition": "在、在场、可找到；表示某人或某物在特定地点，或当下可取得。", "en_definition": "Be present, be at a location, or be available there.", "ms_definition": "Berada atau boleh ditemukan di tempat tertentu. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "Ibu ada di rumah = 妈妈在家；Buku itu ada di perpustakaan = 那本书图书馆有。正式表达也可用 berada；口语 ada kat rumah 中 kat 对应地点介词 di。"}, {"id": 3, "pos": "verb", "zh_definition": "有、拥有、具有；主语之后接所拥有的物品、时间、条件、想法等。", "en_definition": "Have; possess; have something available to oneself.", "ms_definition": "mempunyai", "nuances": "DBP《Kamus Dewan》第四版义项摘录。Saya ada masa = 我有空；Dia ada dua orang anak = 他／她有两个孩子。正式文字依语境可用 mempunyai；否定可用 tidak ada／tiada，口语常用 tak ada。"}, {"id": 4, "pos": "verb", "zh_definition": "还在世、尚健在；谈及人的存活，常与 masih 连用。", "en_definition": "Still be alive; be living, often with masih.", "ms_definition": "masih hidup", "nuances": "依 DBP《Kamus Dewan》第四版。Ayahnya masih ada 可意为父亲还健在；dah tak ada 在适当语境是去世的委婉语，不一定只是出门不在，须看谈话背景。"}, {"id": 5, "pos": "particle", "zh_definition": "确实有、的确；放在动词前确认动作确曾发生或事实成立，口语中也可能带近期经历的意味。", "en_definition": "Did; indeed; affirms that an action occurred or that a proposition is true.", "ms_definition": "Menegaskan bahawa sesuatu perbuatan memang berlaku. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "DBP 说明为强化后接动词，本 Schema 归 particle，不当作所有语境通用的完成时。Saya ada telefon dia semalam = 我昨天确实给他／她打过电话。Kaikki 的完成体标签不能推出 ada = sudah；进行中的动作，规范表达用 sedang，不能套用克里奥尔语种中的进行体用法。"}, {"id": 6, "pos": "particle", "zh_definition": "点名时回答到、在；确认自己出席。", "en_definition": "Present; here; an answer to a roll call.", "ms_definition": "hadir", "nuances": "DBP《Kamus Dewan》第四版列有点名应答义。老师点名时答 Ada! 可以表示在场；也可依场合答 Hadir!。不是所有独立 ada 都是“我拥有”。"}, {"id": 7, "pos": "particle", "zh_definition": "口语中置于问句前，询问是否做过或是否发生某事，有时使问法更委婉。", "en_definition": "Introduces a conversational question about whether something happened or was done.", "ms_definition": "Membuka pertanyaan yang lebih lembut tentang sesuatu perbuatan. (Olahan berdasarkan Kamus Dewan Edisi Keempat.)", "nuances": "如 Ada nampak kunci saya? = 有看到我的钥匙吗？规范完整问法可写 Adakah encik melihat kunci saya?。ada 的词义、语调与语境共同决定问句功能，不能把所有 ada + 动词 都当问句。"}], "dual_scenarios": [{"scenario": "formal", "context": "社区公告 / 活动报名名额", "ms": "Masih ada beberapa tempat kosong untuk peserta yang ingin menyertai bengkel tersebut.", "zh": "该工作坊仍有少量名额，供有意参加者报名。", "en": "A few places are still available for those wishing to attend the workshop."}, {"scenario": "colloquial", "context": "WhatsApp / 朋友在商场碰面", "ms_spoken": "Saya ada kat kedai kopi bawah ni. Datang sini dulu lah.", "ms_standard": "Saya ada di kedai kopi di tingkat bawah ini. Datang ke sini dahulu.", "zh": "我在楼下这家咖啡店。你先过来吧。", "en": "I'm at the coffee shop downstairs. Come here first.", "spoken_features": ["kat 在这里对应 di；ni = ini；dulu = dahulu。", "口语省略可推知的 tingkat 和第二句的方向词 ke。", "lah 在这里缓和邀请；ada 表示所在，不是英语 have 的机械对应。"]}], "spoken_shortcuts": [{"abbr": "ade", "full_form": "ada", "note": "反映词尾 /ə/ 的非正式拼写，常见于部分半岛口音的聊天。"}, {"abbr": "xde", "full_form": "tidak ada", "note": "组合否定的聊天写法，x 表否定、de 反映 ada 的口语省略；不是单独 ada 的同义缩写。"}, {"abbr": "takde", "full_form": "tidak ada", "note": "口语 tak ada 的压缩拼写，表示没有／不在；正式写作宜按句意用 tidak ada 或 tiada。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "请人帮忙时 Boleh tanya, ada...? 或 Encik ada masa sebentar? 往往比突然发问柔和。谈他人家属是否仍健在宜谨慎确认语境，避免把 tak ada 草率理解为已去世。", "usage_etiquette": "Ada apa? 可以是“有什么事？”，语调急促也可能让人觉得不耐烦；服务场合可说 Ada apa-apa yang boleh saya bantu?。have／add 是英文替换或噪声，不列为本词马来语缩写。"}, "etymology": {"origin": "Austronesian (Inherited)", "source_language": "Proto-Malayic; Proto-Malayo-Polynesian", "root_origin": "本地 Kaikki 追溯至原始马来语 *ada(ʔ) 及原始马来－波利尼西亚语 *wada。现代不是 a- + da 的派生；也不能由读音相似联系到英语 add。", "cognitive_memory_aid": "从“有”连起来记：Ada buku（有书），saya ada buku（我有书），buku ada di sini（书在这里）；“是老师”则直接说 saya guru。"}}, {"headword": {"word": "boleh", "syllables": "bo.léh", "ipa": "[bo.leh]", "jawi": "بوليه", "frequency_rank": 19, "status": "official"}, "morphology": {"is_root": true, "root_word": "boleh", "affix": null, "affix_type": "none", "formula": "∅ + boleh → boleh", "pattern_note": "现代基本情态词，不拆成 bo- + leh。meN- (mem-) + boleh + -kan → membolehkan，词首 b 保留；ke- + boleh + -an → kebolehan；ber- + kebolehan → berkebolehan。历史与 beroleh 的联系不构成现代任意缩写规则。", "word_family": [{"word": "membolehkan", "affix": "meN-...-kan", "gloss": "使能够；准许 / enable; permit"}, {"word": "kebolehan", "affix": "ke-...-an", "gloss": "能力、本领 / ability; capability"}, {"word": "berkebolehan", "affix": "ber- + ke-...-an", "gloss": "有能力、有才干 / capable; talented"}, {"word": "seboleh-bolehnya", "affix": "se- + reduplication + -nya", "gloss": "尽可能、尽力 / as far as possible; to the best of one's ability"}]}, "senses": [{"id": 1, "pos": "verb", "zh_definition": "能、能够、可以；表示具备能力，或条件使某事可行。", "en_definition": "Can; be able to; be possible under the circumstances.", "ms_definition": "tidak mustahil utk melakukan sesuatu; dapat", "nuances": "DBP《Kamus Pelajar》第二版；kata bantu ragam 在本 Schema 归 verb。Dia boleh berenang = 他／她会游泳。能力可强调 mampu／pandai，成功做到常用 dapat，三者并非处处可互换。oleh 是另一个词，不能因为字形相近省掉 b。"}, {"id": 2, "pos": "verb", "zh_definition": "可以、获准；表示得到许可，也用于礼貌请求和表示接受、愿意配合的简短回答。", "en_definition": "May; be allowed to; also used in requests and as an affirmative response of consent.", "ms_definition": "tidak dilarang utk melakukan sesuatu; diberi izin", "nuances": "DBP《Kamus Pelajar》第二版。Boleh saya masuk? = 我可以进来吗？答 Boleh = 可以／没问题。tidak boleh 依情境可为不能或不准；boleh 不一定表示说话人已证明有能力完成。请求别人行动用 Boleh tolong...? 常比直接命令温和。"}, {"id": 3, "pos": "verb", "zh_definition": "获得、取得；古旧的实义动词用法，现代通常用 beroleh 或 memperoleh。", "en_definition": "Acquire; obtain, in obsolete usage.", "ms_definition": "Mendapat atau memperoleh sesuatu. (Takrif editorial berdasarkan Kaikki; penggunaan usang.)", "nuances": "所给 Kaikki 标为 obsolete，不能当作现代日常核心义教。历史阅读中才考虑此义；不是在每个 boleh + 名词 结构中都解作获得。"}], "dual_scenarios": [{"scenario": "formal", "context": "公共服务 / 线上申请指引", "ms": "Orang ramai boleh mengemukakan permohonan melalui portal rasmi jabatan tersebut.", "zh": "公众可以通过该部门的官方门户提交申请。", "en": "Members of the public may submit applications through the department's official portal."}, {"scenario": "colloquial", "context": "同事求助 / 请人临时帮忙", "ms_spoken": "Boleh tolong tengokkan beg saya kejap? Saya nak beli air kat sana.", "ms_standard": "Boleh tolong jagakan beg saya sebentar? Saya hendak membeli minuman di sana.", "zh": "能帮我看一下包吗？我去那边买杯饮料。", "en": "Could you watch my bag for a moment? I'm going over there to get a drink.", "spoken_features": ["kejap 在此相当于 sebentar；nak = hendak；kat 在此对应 di。", "tengokkan 在这里口语表示帮忙看管，规范对应 jagakan。", "air 在此指饮料；口语用买东西的动词原形 beli，规范对应 membeli。"]}], "spoken_shortcuts": [{"abbr": "blh", "full_form": "boleh", "note": "聊天中省略元音的常见形式；正式拼写用 boleh。"}, {"abbr": "bleh", "full_form": "boleh", "note": "非正式拼写，省去中间元音，需据上下文理解。"}, {"abbr": "leh", "full_form": "boleh", "note": "口语及聊天可见的缩短；某些混合语句中的 leh 也可能是语气词，不能一律展开。"}, {"abbr": "bole", "full_form": "boleh", "note": "省略末尾 h 的聊天写法；不代表规范发音必须省 h。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "Boleh tolong...? 是大马跨族群服务及日常互动中自然的请求句式；面对长辈、老师或客户可加入称呼和 terima kasih。加 lah 并不必然礼貌：Boleh lah! 的语气不同，也可能显得敷衍或勉强。", "usage_etiquette": "请许可用 Boleh saya...?，请帮助用 Boleh encik／puan tolong...?。口语答 Boleh, nanti saya semak 表示愿意配合，但若尚未确认可完成，就补充条件；不要把印尼 bisa 的缩写 bsa 列为 boleh 的直接简称。"}, "etymology": {"origin": "Austronesian (Inherited; historical analysis)", "source_language": "Earlier Malay; Proto-Malayic (proposed reconstruction)", "root_origin": "Kaikki 将早期 bulih 与 beroleh 联系，并提出追溯至 *mAɣ-ulih 的重建过程。此处标为来源所给的历史分析，不把每一步音变当作已由本批独立证实的定论；现代教学以 boleh 为基本词。", "cognitive_memory_aid": "把两种“可以”并排记：Saya boleh berenang（我会游泳，能力），Boleh saya masuk?（我能进来吗，许可）。"}}, {"headword": {"word": "mereka", "syllables": "me.ré.ka", "ipa": "/məˈrekə/", "jawi": "مريک", "frequency_rank": 20, "status": "official"}, "morphology": {"is_root": true, "root_word": "mereka", "affix": null, "affix_type": "none", "formula": "∅ + mereka → mereka", "pattern_note": "本对象以第三人称复数代词为主词位：代词 mereka 整词记忆，不拆 me-。下列同形动词另属 reka 词族：meN- (me-) + reka → mereka，r 前 meN- 表面为 me-，保留 r；meN- (me-) + reka + -kan → merekakan。同形动词的构词和词源不能回套代词；此处不混入其派生词族。", "word_family": []}, "senses": [{"id": 1, "pos": "pronoun", "zh_definition": "他们、她们；第三人称复数代词，可作主语、宾语或后置领属语，本身不区分性别。", "en_definition": "They; them; their; a gender-neutral third-person plural pronoun, normally referring to people.", "ms_definition": "kata ganti nama diri ketiga (dlm bentuk jamak)", "nuances": "DBP《Kamus Pelajar》第二版。mereka datang = 他们来了；untuk mereka = 给他们；rumah mereka = 他们的家。规范用法通常指人，物品用具体名词、benda-benda itu 等；文学拟人另看语境。一般不再重叠成 mereka-mereka。常见读音 /məˈrekə/，亦有 /məˈreka/；不是 /məˈrəkə/。"}, {"id": 2, "pos": "verb", "zh_definition": "编写、编排、创作；把故事等内容有条理地组织出来。此为 reka 的主动形式，与代词同形。", "en_definition": "Compose or arrange a story or other material; the active form of reka, a homograph of the pronoun.", "ms_definition": "menyusun (mengatur, mengarang) baik-baik", "nuances": "本地 PRPM《Kamus Pelajar》第二版的独立动词义。公式 meN- (me-) + reka → mereka；通常带宾语，如 mereka cerita。代词义和动词义不是相互引申出的同一个词根。"}, {"id": 3, "pos": "verb", "zh_definition": "构思、设想、想办法；在脑中筹划某事。常见重叠形式 mereka-reka，部分语境也指捏造。", "en_definition": "Devise, imagine, or plan something; often in the reduplicated form mereka-reka, which can also imply fabrication.", "ms_definition": "memikir-mikirkan sesuatu; membayangkan dlm fikiran; mencari akal; mencari ikhtiar", "nuances": "DBP《Kamus Pelajar》第二版动词义，不是“他们”的延伸。mereka-reka alasan 可能表示编造借口；筹划与捏造的褒贬由宾语、语境决定，不能一律译为 lying。"}, {"id": 4, "pos": "verb", "zh_definition": "设计、发明、创造；思考并创造新的事物。此义同样属于 reka 的主动形式。", "en_definition": "Design, invent, or create something through thought and planning.", "ms_definition": "memikir-mikirkan dan mencipta sesuatu", "nuances": "DBP《Kamus Pelajar》第二版动词义。Juruteranya mereka alat baharu 中，juruteranya 为主语，mereka 为“设计”；Mereka mereka alat baharu 在语法上可形成代词加动词的同形连用，但实际表达宜用更清楚的句型避免歧义。"}], "dual_scenarios": [{"scenario": "formal", "context": "新闻 / 志愿者救援报道", "ms": "Mereka telah membantu memindahkan penduduk ke pusat pemindahan sementara.", "zh": "他们已协助将居民转移至临时疏散中心。", "en": "They have helped move residents to a temporary evacuation centre."}, {"scenario": "colloquial", "context": "WhatsApp / 朋友告知同伴已到", "ms_spoken": "Diorang dah sampai kat bawah. Jom turun sekarang.", "ms_standard": "Mereka sudah tiba di tingkat bawah. Mari kita turun sekarang.", "zh": "他们已经到楼下了。走，咱们现在下去。", "en": "They're already downstairs. Come on, let's go down now.", "spoken_features": ["diorang 是 dia orang 的口语压缩，指他们；是词汇替换，不是从 mereka 直接删音。", "dah = sudah；kat 在此对应 di；口语省略 tingkat。", "jom = mari，邀请听者一起下楼；正式场合保留 mereka。"]}], "spoken_shortcuts": [{"abbr": "diorang", "full_form": "mereka", "note": "大马口语常见的替代词，来自 dia orang；非 mereka 的字母缩写，不适合规范公文。"}, {"abbr": "dorg", "full_form": "mereka", "note": "聊天中对 diorang 的进一步压缩，展开为规范语时通常写 mereka。"}, {"abbr": "diorng", "full_form": "mereka", "note": "省略元音的 diorang 聊天拼写。"}, {"abbr": "depa", "full_form": "mereka", "note": "北部半岛方言中的第三人称复数替代词；限适当方言语境，不是全国通用简称。"}], "cultural_pragmatics": {"register": "standard", "politeness_note": "mereka 是规范复数代词，本身不带粗鲁意味；指值得尊重的群体时可说 para guru、para tetamu 等以明确身份。diorang 在熟人聊天自然，在正式介绍长辈、客户或贵宾时宜用 mereka 或具体称呼。", "usage_etiquette": "先明确他们指谁，再使用代词，避免在场指点别人却只说 diorang。北部 hampa／hangpa 通常是第二人称复数“你们”，不能把它们当 mereka；熟人方言也不宜直接搬进正式称呼。"}, "etymology": {"origin": "Uncertain (pronoun); Malay affixation (verb homograph)", "source_language": "Malay; earlier source of the pronoun unverified", "root_origin": "Kaikki 对代词 mereka 的词源标为未知，并提到它替代了可比较的 *sida(ʔ)；这不证明 mereka 源自 *sida。动词同形词则由 meN- + reka 构成；reka 的更早来源需另核，不能据此称代词为梵语借词。", "cognitive_memory_aid": "用两格画面区分：mereka datang（他们来了，整词代词）；pereka mereka alat（设计者设计器具，动词属 reka 家族）。看到前后句法角色再判义，不凭开头 me- 就拆代词。"}}];
        const wordList = document.getElementById('wordList');
        const cardView = document.getElementById('cardView');

        function renderList() {
            wordList.innerHTML = '';
            wordsData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'word-item' + (index === 0 ? ' active' : '');
                div.innerHTML = `
                    <span><strong>${item.headword.word}</strong> <span style="font-family: Traditional Arabic; color: #b45309; margin-left: 6px;">${item.headword.jawi || ''}</span></span>
                    <span class="rank">#${item.headword.frequency_rank}</span>
                `;
                div.onclick = () => {
                    document.querySelectorAll('.word-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    renderCard(item);
                };
                wordList.appendChild(div);
            });
            if (wordsData.length > 0) {
                renderCard(wordsData[0]);
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ms-MY';
                window.speechSynthesis.speak(u);
            } else {
                alert('您的浏览器不支持语音合成');
            }
        }

        function renderCard(item) {
            const h = item.headword || {};
            const m = item.morphology || {};
            const senses = item.senses || [];
            const dual = item.dual_scenarios || [];
            const shortcuts = item.spoken_shortcuts || [];
            const cult = item.cultural_pragmatics || {};
            const etym = item.etymology || {};

            let sensesHtml = senses.map(s => `

                    <div class="sense-ms">${s.ms_definition || ''}</div>
                    ${s.nuances ? `<div class="sense-nuance">💡 辨析：${s.nuances}</div>` : ''}

            `).join('');

            let scenariosHtml = '';
            if (dual.length > 0) {
                scenariosHtml = '<div class="scenario-grid">';

                    const isFormal = sc.scenario === 'formal';
                    scenariosHtml += `

                });
                scenariosHtml += '</div>';
            }

            cardView.innerHTML = `
                <div class="word-header">
                    <div class="word-title">${h.word}</div>
                    <div class="word-jawi">${h.jawi || ''}</div>
                    <div class="word-meta">[${h.syllables || ''}] &nbsp; ${h.ipa || ''}</div>
                    <button class="audio-pill" onclick="speak('${h.word}')">🔊 发音</button>
                    <span style="margin-left: auto; font-size: 13px; color: #64748b;">语料频次 #${h.frequency_rank}</span>
                </div>

                <div class="section">
                    <div class="section-title">📐 词形形态学与词根演化</div>
                    <div class="formula-box">${m.formula || '∅'}</div>
                    ${m.pattern_note ? `<p style="font-size: 13px; color: #64748b; margin-top: 6px;">${m.pattern_note}</p>` : ''}
                </div>

                <div class="section">
                    <div class="section-title">📖 三语对齐义项 (${senses.length})</div>
                    ${sensesHtml}
                </div>

                <div class="section">
                    <div class="section-title">🎭 双场景实景对白与口语缩写</div>
                    ${scenariosHtml}
                </div>

                <div class="section">

                    <div style="background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.6;">
                        <p><strong>语体语域：</strong>${cult.register || '通用'}</p>
                        <p><strong>礼貌等级：</strong>${cult.politeness_level || '标准'}</p>
                        ${cult.social_rules ? `<p style="color: #b45309; margin-top: 6px;">⚠️ <strong>交际禁忌：</strong>${cult.social_rules}</p>` : ''}
                    </div>
                </div>

                <div class="section">

            `;
        }
